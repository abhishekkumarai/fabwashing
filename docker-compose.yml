services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: laundrypro
      POSTGRES_USER: laundry
      POSTGRES_PASSWORD: laundry
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laundry -d laundrypro"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgres://laundry:laundry@db:5432/laundrypro
      DJANGO_SECRET_KEY: docker-dev-secret
      DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: "*"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  pgdata:
